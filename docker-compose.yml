version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: concept-corner-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: concept-corner
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - concept-corner-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concept-corner-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/concept-corner?authSource=admin
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - concept-corner-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concept-corner-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - concept-corner-network

volumes:
  mongodb_data:

networks:
  concept-corner-network:
    driver: bridge
